name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test

      - name: Run the action on the sample draft
        id: preflight
        uses: ./
        with:
          files: test/fixtures/*.md
          required-headings: Introduction, Conclusion
      - name: Check outputs
        run: |
          test "${{ steps.preflight.outputs.files }}" = "1"
          test "${{ steps.preflight.outputs.errors }}" = "0"
